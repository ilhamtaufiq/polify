server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/xml text/plain;

    # Aset hasil build Astro berhash nama file, aman di-cache lama
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Mendukung URL tanpa ekstensi, mis. /editor -> editor.html atau /editor/index.html
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
